<meta name="description" content="지옥철 냥아치, 고양이 지하철 자리 쟁탈전 게임">
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1f24;--muted:#6b7280;--line:#e6e3dc;--accent:#2e9e4c;--yellow:#f2b705;--leg:#e8a317;--rare:#8b6cf0;--com:#7b8aa0}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2029;--ink:#eef0f4;--muted:#9aa3b5;--line:#2a313d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all}
main{max-width:760px;margin:0 auto;padding:32px 16px 64px}
header{margin-bottom:24px}
.kicker{color:var(--muted);font-size:14px;margin:0}
h1{font-size:28px;line-height:1.3;margin:4px 0 8px}
h2{font-size:19px;margin:32px 0 8px;padding-top:8px;border-top:1px solid var(--line)}
p,li{margin:6px 0}
ul{padding-left:20px}
a{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:600;font-size:13px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:700;color:#fff}
.tag.leg{background:var(--leg)}.tag.rare{background:var(--rare)}.tag.com{background:var(--com)}
.muted{color:var(--muted);font-size:14px}
.logo{font-weight:800;font-size:40px;line-height:1.1;margin:0}
.logo span{color:var(--yellow)}
nav a{display:block;padding:14px 16px;margin:10px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);font-weight:600}
nav a::after{content:"›";float:right;color:var(--muted)}
footer{margin-top:40px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main>
<header>
<p class="kicker">김스튜디오 모바일 게임</p>
<p class="logo">지옥철 <span>냥아치</span></p>
<p>출근길 지옥철, 빈자리는 하나. 눈치 보고 찜하고, 새치기 빌런은 박치기로 참교육하는 고양이 자리 쟁탈전.</p>
